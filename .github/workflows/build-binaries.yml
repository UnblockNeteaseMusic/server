name: Build binaries for UnblockNeteaseMusic

on:
    push:
        branches:
            - 'enhanced'
        paths-ignore:
            - '**.md'
            - 'precompiled/*.js'

    pull_request:
        types:
            - opened
            - synchronize
            - reopened
        paths-ignore:
            - '**.md'
            - 'precompiled/*.js'

    release:
        types:
            - published

jobs:
    build:
        strategy:
            matrix:
                include:
                    - runner: ubuntu-24.04-arm
                      asset: unblockneteasemusic-linux-arm64
                    - runner: ubuntu-latest
                      asset: unblockneteasemusic-linux-x64
                    - runner: windows-11-arm
                      asset: unblockneteasemusic-win-arm64.exe
                    - runner: windows-latest
                      asset: unblockneteasemusic-win-x64.exe
            fail-fast: false

        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Make bundle
              run: yarn build

            - name: Build executable
              run: yarn build:sea

            - name: Verify executable version
              run: |
                  node -e "const { execFileSync } = require('node:child_process');
                  const { version } = require('./package.json');
                  const actual = execFileSync('./dist/${{ matrix.asset }}', ['--version'], { encoding: 'utf8' });
                  require('node:assert/strict').equal(actual.trim(), version);"

            - name: Publishing to GitHub Artifacts
              uses: actions/upload-artifact@v7
              if: github.event_name != 'release'
              with:
                  name: ${{ matrix.asset }}
                  path: dist/${{ matrix.asset }}

            - name: Publishing to GitHub Releases
              uses: svenstaro/upload-release-action@2.11.5
              if: github.event_name == 'release'
              with:
                  repo_token: ${{ github.token }}
                  file: dist/${{ matrix.asset }}
                  asset_name: ${{ matrix.asset }}
                  tag: ${{ github.ref }}
