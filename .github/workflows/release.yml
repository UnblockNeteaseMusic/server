name: Release

# Publish a GitHub release to the package channels: the npm package (npm trusted publishing, no
# token), GitHub Packages and the Docker image (signed with cosign). Each publishing job has its
# own environment, whose rules keep its credentials to release runs.
#
# The executables are not built here. Releases are immutable, so release-pr.yml builds and signs
# them and creates the draft release with them already attached; publishing the draft starts this.
#
# Manual run: rehearse. It builds every executable and publishes nothing.
on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    rehearsal:
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/workflows/binaries.yml

    npm:
        name: npm
        if: github.event_name == 'release'
        runs-on: ubuntu-slim
        timeout-minutes: 15
        environment: npm
        permissions:
            contents: read
            # npm trusted publishing: the registry trusts this workflow's OIDC token, so no
            # NPM_TOKEN exists. The package's trusted publisher names release.yml and `npm`.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: nix develop -c npm publish --provenance --access public

    github-packages:
        name: GitHub Packages
        if: github.event_name == 'release'
        runs-on: ubuntu-slim
        timeout-minutes: 15
        environment: github-packages
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Publish
              run: |
                  umask 077
                  printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
                  NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" \
                      nix develop -c npm publish --registry https://npm.pkg.github.com
              env:
                  GITHUB_TOKEN: ${{ github.token }}

    docker:
        if: github.event_name == 'release'
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/docker.yml
        with:
            tags: |
                pan93412/unblock-netease-music-enhanced:latest
                pan93412/unblock-netease-music-enhanced:release
                pan93412/unblock-netease-music-enhanced:${{ github.event.release.tag_name }}
