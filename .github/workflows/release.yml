name: Release

# A tag vX.Y.Z (pushed by release-pr.yml after the release pull request is merged) builds and signs
# the executables and creates the draft release with them attached and the notes: the TL; DR; and
# the lists of the section, the download steps (scripts/release/install.md), then the new
# contributors and the full changelog link that GitHub writes. Releases are immutable, so the draft is complete before anyone can publish it.
#
# A maintainer publishes the draft. That publishes the npm package (npm trusted publishing, no
# token), the GitHub Packages package and the Docker image (signed with cosign). Each publishing
# job has its own environment, whose rules keep its credentials to release runs.
#
# Manual run: rehearse. It builds every executable and publishes nothing. To redo a failed tag
# run, re-run it; a draft that exists must be deleted first.
on:
    push:
        tags: ['v[0-9]*']
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        if: github.event_name == 'push'
        runs-on: ubuntu-slim
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: The tag is on enhanced and has a CHANGELOG.md section
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/enhanced
                  node scripts/release/changeset.mjs notes "$TAG" >/dev/null

    binaries:
        needs: check
        # A rehearsal has no check; a published release builds nothing here.
        if: ${{ !cancelled() && github.event_name != 'release' && needs.check.result != 'failure' }}
        permissions:
            contents: read
        uses: ./.github/workflows/binaries.yml

    draft:
        if: github.event_name == 'push'
        needs: [check, binaries]
        runs-on: ubuntu-slim
        timeout-minutes: 15
        environment: github-release
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: binary-*
                  path: dist
                  merge-multiple: true
            - uses: ./.github/actions/setup
            - name: Sign the executables
              run: nix develop -c scripts/ci/sign.sh dist
            - name: Create the draft release with the executables
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
              run: |
                  previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^")
                  {
                      node scripts/release/changeset.mjs notes "$TAG"
                      echo
                      sed "s/{{TAG}}/$TAG/g" scripts/release/install.md
                      echo
                      # GitHub writes the new contributors and the link to the full changelog.
                      gh api "repos/$GH_REPO/releases/generate-notes" \
                          -f tag_name="$TAG" -f previous_tag_name="$previous" --jq .body \
                          | awk '/^## New Contributors|^\*\*Full Changelog/ { p = 1 } p'
                  } > "$RUNNER_TEMP/notes.md"
                  gh release create "$TAG" --draft --verify-tag --title "$TAG" \
                      --notes-file "$RUNNER_TEMP/notes.md" dist/*

    npm:
        name: npm
        if: github.event_name == 'release'
        runs-on: ubuntu-slim
        timeout-minutes: 15
        environment: npm
        permissions:
            contents: read
            # npm trusted publishing: the registry trusts this workflow's OIDC token, so no
            # NPM_TOKEN exists. The package's trusted publisher names release.yml and `npm`.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: nix develop -c npm publish --provenance --access public

    github-packages:
        name: GitHub Packages
        if: github.event_name == 'release'
        runs-on: ubuntu-slim
        timeout-minutes: 15
        environment: github-packages
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Publish
              run: |
                  umask 077
                  printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
                  NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" \
                      nix develop -c npm publish --registry https://npm.pkg.github.com
              env:
                  GITHUB_TOKEN: ${{ github.token }}

    docker:
        if: github.event_name == 'release'
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/docker.yml
        with:
            tags: |
                pan93412/unblock-netease-music-enhanced:latest
                pan93412/unblock-netease-music-enhanced:release
                pan93412/unblock-netease-music-enhanced:${{ github.event.release.tag_name }}
