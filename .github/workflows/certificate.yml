name: Certificate

# The default certificate (server.crt, server.key) lasts a year. 60 days before it ends, this
# workflow signs a new one with the root CA and opens the pull request `release/certificate`. The
# CA key is the secret CA_KEY of the environment `certificate`, which keeps it to `enhanced`.
on:
    schedule:
        - cron: '17 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: certificate
    cancel-in-progress: false

jobs:
    renew:
        if: github.ref == 'refs/heads/enhanced'
        runs-on: ubuntu-slim
        timeout-minutes: 10
        environment: certificate
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - id: due
              name: Check the end date
              run: |
                  if scripts/ci/cert.sh due; then
                      echo "due=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "More than 60 days left."
                      echo "due=false" >> "$GITHUB_OUTPUT"
                  fi
            - id: open
              name: Look for an open pull request
              if: steps.due.outputs.due == 'true'
              run: |
                  count=$(gh pr list --head release/certificate --state open --json number --jq length)
                  echo "open=$count" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
            - name: Sign the new certificate
              if: steps.due.outputs.due == 'true' && steps.open.outputs.open == '0'
              run: scripts/ci/cert.sh renew
              env:
                  CA_KEY: ${{ secrets.CA_KEY }}
            # A pull request opened with GITHUB_TOKEN starts no checks; one opened by the App does.
            - id: app
              if: steps.due.outputs.due == 'true' && steps.open.outputs.open == '0'
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
                  permission-pull-requests: write
            - if: steps.app.outcome == 'success'
              uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              with:
                  token: ${{ steps.app.outputs.token }}
                  add-paths: |
                      server.crt
                      server.key
                      .changeset/renew-certificate-*.md
                  branch: release/certificate
                  delete-branch: true
                  author: 'unmbot[bot] <360948888+unmbot[bot]@users.noreply.github.com>'
                  committer: 'unmbot[bot] <360948888+unmbot[bot]@users.noreply.github.com>'
                  commit-message: 'sec(cert): renew default certificate'
                  title: 'sec(cert): renew default certificate'
                  body: |
                      server.crt ends within 60 days, so this signs a new one with the root CA, the same subject and names, valid for a year.
                      ca.crt does not change. The change file is included.
