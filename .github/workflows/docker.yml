name: Docker image

# Build the multi-platform image from precompiled/, push it and sign it with cosign (keyless).
# The Docker Hub credentials live in the `dockerhub` environment only, so the callers pass none.
on:
    workflow_call:
        inputs:
            tags:
                description: Image tags, one per line, as docker/build-push-action reads them
                required: true
                type: string

permissions:
    contents: read

jobs:
    push:
        runs-on: ubuntu-26.04-arm
        timeout-minutes: 60
        environment: dockerhub
        permissions:
            contents: read
            id-token: write
        env:
            IMAGE: pan93412/unblock-netease-music-enhanced
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
                  push: true
                  provenance: mode=max
                  sbom: true
                  tags: ${{ inputs.tags }}
            - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
            - name: Sign the image by its digest
              run: nix develop -c cosign sign --yes "${IMAGE}@${DIGEST}"
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
