name: Release pull request

# Run by hand on `enhanced`: the change files in .changeset/ become the next section of
# CHANGELOG.md and the next version, in the pull request `chore(release): vX.Y.Z` from
# release/next, opened by the release App (environment release-pr), with the rebuilt precompiled/
# bundle, which holds the version. Merge or close it before preparing another.
#
# Merging it starts the second job: it tags the last commit that changed CHANGELOG.md with the
# newest section's version, unless that tag exists. The App pushes the tag, since a tag pushed with
# GITHUB_TOKEN would start no workflow. The tag starts release.yml, which builds and signs the
# executables and creates the draft release with them attached. Releases are immutable, so the
# draft is complete before anyone can publish it.
on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version instead of the one the change files give (0.29.0); empty for theirs'
                default: ''
    push:
        branches: [enhanced]
        paths: [CHANGELOG.md, .github/workflows/release-pr.yml]

permissions:
    contents: read

concurrency:
    group: release-pr-${{ github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/enhanced'
        runs-on: ubuntu-slim
        timeout-minutes: 10
        # The App's key lives in this environment, whose rules keep it to `enhanced`.
        environment: release-pr
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            # A pull request opened with GITHUB_TOKEN starts no checks; one opened by the App does.
            - id: app
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
                  permission-pull-requests: write
            - id: release
              name: Write CHANGELOG.md and the version
              run: echo "tag=$(node scripts/release/changeset.mjs prepare "$VERSION")" >> "$GITHUB_OUTPUT"
              env:
                  VERSION: ${{ inputs.version }}
            - uses: ./.github/actions/setup
            - name: Rebuild precompiled/ with the new version
              run: nix develop -c yarn build
            - id: notes
              name: Write the pull request body
              run: |
                  {
                      echo 'body<<EOF'
                      echo "Merging this creates the draft release $TAG. Edit CHANGELOG.md on this branch first if the section should read differently."
                      echo
                      node scripts/release/changeset.mjs notes "$TAG"
                      echo 'EOF'
                  } >> "$GITHUB_OUTPUT"
              env:
                  TAG: ${{ steps.release.outputs.tag }}
            - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              with:
                  token: ${{ steps.app.outputs.token }}
                  branch: release/next
                  delete-branch: true
                  author: 'unmbot[bot] <360948888+unmbot[bot]@users.noreply.github.com>'
                  committer: 'unmbot[bot] <360948888+unmbot[bot]@users.noreply.github.com>'
                  commit-message: 'chore(release): ${{ steps.release.outputs.tag }}'
                  title: 'chore(release): ${{ steps.release.outputs.tag }}'
                  body: ${{ steps.notes.outputs.body }}
                  labels: no changeset

    tag:
        if: github.event_name == 'push' && github.ref == 'refs/heads/enhanced'
        runs-on: ubuntu-slim
        timeout-minutes: 5
        environment: release-pr
        steps:
            - id: release
              name: Find the release that has no tag
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version=$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_SHA" \
                      -H "Accept: application/vnd.github.raw" | awk '/^## [^ ]+ \(/ && !v { v = $2 } END { print v }')
                  [ -n "$version" ] || { echo "CHANGELOG.md has no release section"; exit 1; }
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
                      echo "v$version is already tagged"
                      exit 0
                  fi
                  sha=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=CHANGELOG.md&sha=$GITHUB_SHA&per_page=1" --jq '.[0].sha')
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
            - id: app
              if: steps.release.outputs.tag != ''
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
            - name: Tag the release commit
              if: steps.release.outputs.tag != ''
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  TAG: ${{ steps.release.outputs.tag }}
                  SHA: ${{ steps.release.outputs.sha }}
              run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" --silent
